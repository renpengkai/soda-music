# 汽水音乐 —— viva build / viva package 读取这个文件。
#
#   go tool viva build                         当前平台的原生程序   -> build/
#   go tool viva build --target windows        给 Windows 交叉构建
#   go tool viva package --format zip,nsis     安装包
#   go tool viva dev .                         热重载开发

[app]
name = "汽水音乐"
id = "dev.sodamusic.app"
version = "0.2.2"
executable = "soda-music"
package = "."
icon = "assets/icon.png"

[build]
out = "build"

[mac]
min_system = "13.0"
category = "public.app-category.music"
copyright = "Copyright (c) 2026 soda-music contributors"

[linux]
category = "AudioVideo"
comment = "汽水音乐 —— 用 Go 与 Viva 写的原生桌面音乐播放器"
maintainer = "soda-music contributors <soda-music@users.noreply.github.com>"
homepage = "https://github.com/vivaui/viva"
keywords = ["music", "player", "audio", "soda"]

[windows]
publisher = "soda-music"
scope = "user"
url = "https://github.com/vivaui/viva"