name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            target: darwin
            arch: arm64
            formats: app,zip,dmg
          - name: macOS amd64
            runner: macos-latest
            target: darwin
            arch: amd64
            formats: app,zip,dmg
          - name: Windows amd64
            runner: windows-latest
            target: windows
            arch: amd64
            formats: nsis,zip
          - name: Linux amd64
            runner: ubuntu-latest
            target: linux
            arch: amd64
            formats: tar.gz,deb
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./... -count=1

      - name: Install NSIS
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }

      - name: Build and package
        run: go tool viva package --target ${{ matrix.target }} --arch ${{ matrix.arch }} --format ${{ matrix.formats }} --no-sign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soda-music-${{ matrix.target }}-${{ matrix.arch }}
          path: build/*
          if-no-files-found: error

      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/*.dmg
            build/*.tar.gz
            build/*.deb
            build/*-setup.exe
          fail_on_unmatched_files: false